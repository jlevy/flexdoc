name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: # Enable manual trigger.
  workflow_call: # Callable from release.yml, which cannot fire the release event.

jobs:
  # The `release` event does not wait for the push CI workflow. Require that workflow
  # to have succeeded on this commit before uploading (tagging can race CI).
  require-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require CI success on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          echo "Waiting for workflow ci.yml on ${sha}"
          for _ in $(seq 1 60); do
            json="$(gh run list --repo "${GITHUB_REPOSITORY}" --commit "${sha}" --workflow ci.yml --limit 1 --json status,conclusion,url)"
            if [[ "${json}" == "[]" ]]; then
              echo "No CI run yet"
              sleep 10
              continue
            fi
            status="$(jq -r '.[0].status' <<<"${json}")"
            conclusion="$(jq -r '.[0].conclusion' <<<"${json}")"
            url="$(jq -r '.[0].url' <<<"${json}")"
            echo "CI ${url} status=${status} conclusion=${conclusion}"
            if [[ "${status}" != "completed" ]]; then
              sleep 10
              continue
            fi
            if [[ "${conclusion}" != "success" ]]; then
              echo "CI did not succeed on ${sha}" >&2
              exit 1
            fi
            exit 0
          done
          echo "Timed out waiting for CI on ${sha}" >&2
          exit 1

  build-and-publish:
    needs: require-ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Mandatory for OIDC.
      contents: read
    steps:
      - name: Checkout (official GitHub action)
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          # Important for versioning plugins:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        # astral-sh/setup-uv@v8.1.0
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.12"
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python (using uv)
        run: uv python install

      - name: Install all dependencies
        # Install from the committed lockfile so the release is built and tested
        # against the exact vetted versions (the pyproject cool-off governs upgrades).
        run: uv sync --all-extras --locked

      - name: Run tests
        run: uv run --frozen pytest

      - name: Audit dependencies for known vulnerabilities
        # Same export + uvx pattern as ci.yml. Do not lock pip-audit.
        # See SUPPLY-CHAIN-SECURITY.md.
        run: |
          REQ="${RUNNER_TEMP}/requirements-audit.txt"
          uv export --frozen --all-extras --all-groups --no-emit-project -q -o "${REQ}"
          uvx pip-audit --disable-pip --no-deps -r "${REQ}"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
        # Although uv is newer and faster, the "official" publishing option is the one from PyPA,
        # which uses twine. If desired, replace `uv publish` with:
        # uses: pypa/gh-action-pypi-publish@release/v1
